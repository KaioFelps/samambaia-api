[package]
name = "samambaia"
version.workspace = true
edition.workspace = true

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace]
members = [".", "migration", "entities", "cli", "tests"]

[workspace.dependencies]
deadpool-redis = "0.23.1"
sqlx = "0.9"
async-trait = "0.1.83"
thiserror = "2.0.21"
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"] }
uuid = { version = "1.26", features = ["v4"] }
tokio = { version = "1.42", features = ["full"] }
actix-web = "4.15.0"
actix-web-lab = "0.27.0"
dotenvy = "0.15.7"
log = "0.4"
env_logger = "0.11.11"
sea-orm = { version = "2.0.2", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "chrono",
    "with-json",
    "with-uuid",
] }
serde = "1.0"
chrono = { version = "0.4", features = ["clock"] }
serde_json = "1.0"

[features]
end-to-end-test = []

[dependencies]
redis.workspace = true
migration = { path = "migration" }
entities = { path = "entities" }
tokio.workspace = true
serde_json.workspace = true
serde-envfile = "0.4.1"
uuid.workspace = true
chrono.workspace = true
config = "0.15.4"
validator = { version = "0.21", features = ["derive"] }
jsonwebtoken = "9.3.0"
http = "1.2.0"
password-auth = "1.0.0"
async-trait.workspace = true
regex = "1.11.1"
unicode-normalization = "0.1.24"
duplicate = "2.0.0"
actix-web.workspace = true
actix-web-lab.workspace = true
sea-orm.workspace = true
serde.workspace = true
dotenvy.workspace = true
log.workspace = true
env_logger.workspace = true
inertia-rust = { version = "2.4.6", features = [
    "actix",
    "vite-hbs-template-resolver",
    "actix-validator",
] }
vite-rust = "0.2.4"
actix-files = "0.7.0"
actix-session = "0.11"
anyhow = "1.0.95"
rand = "0.8.5"
base64 = "0.22.1"
sqlx.workspace = true
url = "2.5.7"
reqwest = "0.12.23"
moka = { version = "0.12.12", features = ["future"] }
deadpool-redis.workspace = true

[dev-dependencies]
mockall = "0.13.0"
derive_builder = "0.20.2"
fake = { version = "4.3.0", features = ["derive", "chrono", "url"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
