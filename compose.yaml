name: "samambaia-api"

services:
  postgres:
    container_name: rust-clean-postgres
    mem_reservation: "100mb"
    image: postgres
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: rust-clean
    profiles:
      - dev

  pgadmin:
    container_name: postgres-admin
    image: dpage/pgadmin4
    ports:
      - 82:80
    environment:
      PGADMIN_DEFAULT_EMAIL: tempemail@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    profiles:
      - analytic

  redis:
    image: redis/redis-stack-server:latest
    container_name: samambaia-api-redis
    environment:
      REDIS_ARGS: |
        --requirepass ${REDIS_PASSWORD}
        --user ${REDIS_USER}
        on >${REDIS_PASSWORD} allkeys allcommands +@all
    ports:
      - ${REDIS_PORT}:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - dev
